name: Daily grocery DB news scrape

on:
  schedule:
    # ~7:27 AM IST = 01:57 UTC. Moved off 23:xx UTC (near-midnight is one of
    # GitHub Actions' most congested schedule slots, causing 8-13h delays).
    - cron: "57 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run grocery DB news scraper (all batches)
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        # --all makes the script loop internally through every ~100-company
        # batch, checkpointing to data/grocery_db_news/progress_state.json
        # after each one, until today's full company list is covered.
        run: python grocery_db_news.py --all --chunk-size 100

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/grocery_db_news master_file/grocery_db_news_master.csv
          git diff --cached --quiet || git commit -m "Grocery DB news scrape: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
