name: Daily grocery news scrape

on:
  schedule:
    # 5:00 AM IST = 23:30 UTC (previous day)
    - cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for patchright
        run: python -m patchright install chromium --with-deps

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run grocery news scraper
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: xvfb-run -a python grocery_news.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_articles.parquet
          git diff --cached --quiet || git commit -m "Grocery news scrape: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
