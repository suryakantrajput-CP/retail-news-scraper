name: Daily news scrape

on:
  schedule:
    # 5:00 AM IST = 23:30 UTC (previous day)
    - cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for patchright
        run: python -m patchright install chromium --with-deps

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run grocery news scraper
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: xvfb-run -a python grocery_news.py

      - name: Run priority banner scraper
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python priority_banner.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data master_file all_articles.parquet latest_news.json
          git diff --cached --quiet || git commit -m "Daily scrape: $(date -u +%Y-%m-%d)"
          git push

      - name: Refresh dashboard data snapshot
        run: |
          mkdir -p retail-news-dashboard/data-snapshot/master_file
          cp all_articles.parquet retail-news-dashboard/data-snapshot/all_articles.parquet
          cp master_file/banner_news_master.csv retail-news-dashboard/data-snapshot/master_file/banner_news_master.csv

      - name: Deploy dashboard to Vercel
        working-directory: retail-news-dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN"
