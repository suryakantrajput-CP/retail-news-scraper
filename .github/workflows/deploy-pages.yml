name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "all_articles.parquet"
      - "master_file/**"
      - "retail-news-dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  # The daily scrape workflows commit with the default GITHUB_TOKEN, and
  # GitHub's anti-recursion rule means pushes made with that token never
  # trigger other `on: push` workflows (including this one) — so without
  # this trigger, the site would only ever redeploy on a manual push.
  # `workflow_run` is exempt from that restriction.
  workflow_run:
    workflows:
      - "Daily grocery news scrape"
      - "Daily priority banner scrape"
      - "Daily community impact scrape"
      - "Daily grocery DB news scrape"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: retail-news-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: retail-news-dashboard
        run: npm install

      - name: Build static export
        working-directory: retail-news-dashboard
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: retail-news-dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
