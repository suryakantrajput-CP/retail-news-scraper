name: Daily community impact scrape

on:
  schedule:
    # ~6:53 AM IST = 01:23 UTC. Moved off 23:xx UTC (near-midnight is one of
    # GitHub Actions' most congested schedule slots, causing 8-13h delays).
    - cron: "23 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for patchright
        run: python -m patchright install chromium --with-deps

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run community impact scraper
        run: xvfb-run -a python community_impact.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/community_impact master_file/community_impact_master.csv
          git diff --cached --quiet || git commit -m "Community impact scrape: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
