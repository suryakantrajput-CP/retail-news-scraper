name: Daily priority banner scrape

on:
  schedule:
    # ~7:11 AM IST = 01:41 UTC. Moved off 23:xx UTC (near-midnight is one of
    # GitHub Actions' most congested schedule slots, causing 8-13h delays).
    - cron: "41 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run priority banner scraper
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: python priority_banner.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data master_file latest_news.json
          git diff --cached --quiet || git commit -m "Priority banner scrape: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
